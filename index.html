<html lang="si">
<head>
    <meta charset="UTF-8">

    <title>ChordsBook++ | Professional Chord Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f0f11;
            --bg-container: #141218;
            --bg-card: #1d1b20;
            --bg-card-hover: #2b2930;
            --bg-input: #2b2930;
            --text-main: #e6e1e5;
            --text-muted: #938f99;
            --primary: #d0bcff;
            --border: #2d2d31;
        }

        .light-theme {
            --bg-main: #f8f9fa;
            --bg-container: #FDF8FF;
            --bg-card: #F7F2FA;
            --bg-card-hover: #f1ecf7;
            --bg-input: #F3F0F5;
            --text-main: #1C1B1F;
            --text-muted: #49454F;
            --border: #e5e7eb;
            --primary: #6750A4;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .app-container {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            position: relative;
            background-color: var(--bg-container);
            transition: background-color 0.3s ease;
        }

        .page {
            position: absolute;
            inset: 0;
            background-color: var(--bg-container);
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
            z-index: 5;
        }

        .home-active #homePage { transform: translateX(0); opacity: 1; z-index: 20; pointer-events: auto; }
        .home-active #lyricsPage { transform: translateX(100%); opacity: 0; z-index: 10; pointer-events: none; }
        .lyrics-active #homePage { transform: translateX(-20%); opacity: 0; z-index: 10; pointer-events: none; }
        .lyrics-active #lyricsPage { transform: translateX(0); opacity: 1; z-index: 20; pointer-events: auto; }

        .song-card {
            padding: 1.1rem 1.25rem;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            cursor: pointer;
            border: 1px solid var(--border);
            background-color: var(--bg-card);
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        .song-card:active { transform: scale(0.96); }

        .control-btn {
            padding: 0.75rem;
            border-radius: 1rem;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .control-btn:active { transform: scale(0.9); }

        .search-wrapper { position: relative; display: flex; align-items: center; }
        .clear-btn {
            position: absolute;
            right: 12px;
            padding: 6px;
            border-radius: 50%;
            color: var(--text-muted);
            cursor: pointer;
            display: none;
        }

        .lyrics-block { margin-bottom: 2.5rem; }
        .lyrics-line {
            display: block;
            margin-top: 1.6rem; 
            line-height: 1.8;
            font-size: clamp(1.15rem, 4.8vw, 1.45rem);
            position: relative;
            white-space: pre-wrap;
            transition: margin-top 0.2s ease-out;
            will-change: margin-top;
        }

        .chord-wrapper {
            position: relative;
            display: inline-flex;
            width: 0;
            justify-content: center;
            vertical-align: baseline;
        }

        .chord-tag {
            position: absolute;
            bottom: 1.2em; 
            left: 50%;
            transform: translateX(-50%);
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85em; 
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.2s ease;
        }

        .lyrics-only-mode .chord-tag { opacity: 0; pointer-events: none; }
        .lyrics-only-mode .lyrics-line { margin-top: 0.4rem; }

        #chordToolbar {
            transition: all 0.3s ease;
            max-height: 150px;
            overflow: hidden;
        }

        .lyrics-only-mode-toolbar {
            max-height: 0 !important;
            padding: 0 !important;
            border-bottom-width: 0 !important;
            opacity: 0;
        }

        /* Home Header Animation Styles */
        .header-anim-container {
            position: relative;
            height: 32px;
            overflow: hidden;
        }
        .header-anim-text {
            position: absolute;
            inset: 0;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
        }
        .text-out { transform: translateY(-110%); opacity: 0; }
        .text-in { transform: translateY(0); opacity: 1; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease;
        }
        .modal-active { opacity: 1; visibility: visible; }

        .gradient-text {
            background: linear-gradient(90deg, #d0bcff, #ff85b2, #7ce2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>

      "content": "(පාට් එක පටන්ගන්නෙ පියානෝ එකෙන් මුලින්ම)\n(ඊට පස්සෙ රෝලින් එකක් දාල පටන්ගන්නෙ)\n(Cajun & Bass එක)\n\nමිහිරි [C]සුවඳක් ලෙසින්\nඔබ [F]නමදින්නෙ[Am]මී\nපූජාවක් වෙ[Dm]ලා ඔබ [G]පසසන්නෙ[C]මී..//\n\nමුළු ⁣[F]ළෝකයම [G]අතහැර[C]ලා\nඔබ [G]ලඟට එ[C]මී\n[Am]පූජාවක් වෙ[Dm]ලා ඔබ [G]පසසන්නෙ[C]මී..//\n\nමම [C]සමිඳුන්ගෙන් එක් දෙයක් [Am]ඉල්ලන්නෙ[Dm]මී\nමුළු [G]හදවතින් මම එය සොයන්නෙ[C]මී\nඑතුම් මාලිගයේ සැමදාම [A]වෙසෙන්නෙ[Dm]මී\nඅල[G]ංකාරය සැමදාම දකින්නෙ[C]මී\nමිහිරි [C]සුවඳක්.....",

      "Id": 16,

      "Capo": 0,
      "content": "1.ජේසුස් සුරිඳු දෙව් අනුහසිනා\nමේ දින සුවකරනා\nරෝගින් අදහා එනු දැන්\nසැනිනා ලැබගත් සුවවීමා\nරෝගින් එනු ආ..රෝගින් එනු ආ...\nදෙව හස්තේ මාරුවී නෑ රෝගින් එනු ආ...\n\n2.පව්ගැන තැවිලා ජේසුට\nබැතිනා භාර වෙනුව සැනිනා\nඒ සොඳ එතුමා පව්බර ඔබෙනා\nතිර ලෙස පහකරනා\nරෝගින් එනු ආ...\n\n3.තේජ කුමරිද ඒ රුදු යකුගේ\nඔදබල බිඳ හෙඵවා\nපාපෙන් ජයදී රෝගය\nඉසිල් කල්වරි කුරුසේ එදා\nරෝගින් එනු ආ...\n\n4.ජේසුස් සමිදු කල්වරියේදී\nඒ ලත් පහරින්නා\nසැම දනන්ගේ රෝ බල බිඳලා\nජීවය ගෙනදුන්නා\nරෝගින් එනු ආ...\n\n5.නාමය ඔබගේ සුව කරන්නේ\nමේ ලෙස කී යෙහොවා...\nමේ ඔබ වචනේ මාරු නොවන්නේ\nගිවිසුම කඳු ලෙසිනා\nරෝගින් එනු ආ...\n\n6.ඒ සිය වචනේ ලෝ වෙත\nඑව්වේ රෝ සුවකරන ලෙසා\nමේ සුව දහරේ ගිලෙමින්\nපැදි ලැබගත් සුවවීමා\nරෝගින් එනු ආ...\n",

      "Id": 22,
      "author": "Balled / PopWaltz",
      "Capo": 0,
      "content": "හෝසන්[Gm]නා...\nහෝසන්[F]නා...\nහෝසන්[Eb]නා...\nහෝසන්[Bb]නා...\nහෝසන්[Gm]නා...\nහෝසන්[Cm]නා..\n[Eb]දේවාති [F]දෙවිඳුනිවේ [Gm]හෝසන්නා\n[Eb]රාජාති [F]රජිඳුනිවේ [Gm]හෝසන්නා\n\n\n[Gm]දෙවිඳු නමින් වඩින රජුන්\nආසිරි වේ[D]වා....\nජීවමාන පුතුනි ඔබට\nපැසසුම් වේ[Gm]වා\n\n[Gm]ලාසරස්ට ප්‍රාණය දුන්  ජේසුනි සමි[F]‌දේ\nජීවමාන රජුන් ඔබයි [D]ජේසු සමිඳු[Gm]නේ\n[Gm]දෙවිඳුන් අපහට දුන් රන් කරඬුව වැන්[F]නේ\nදවිඳු රජුන් පුතුන් ඔබයි [D]ජේසු රජින්[Gm]දේ\n\n[G]අසරණයට ජල දඑහරා [C]ගඟුල ගලන්නා\n[Gm]එවන් ගඟුල ජේසුනි ඔබ [Eb]හට හෝසන්[Gm]නා\nදේව [Eb]පුතුන් [F]වඩින්[Gm]නා\n\nහෝසන්[Gm]නා...\nහෝසන්[F]නා...\nහෝසන්[Eb]නා...\nහෝසන්[Bb]නා...\nහෝසන්[Gm]නා...\nහෝසන්[Cm]නා..\n[Eb]දේවාති [F]දෙවිඳුනිවේ [Gm]හෝසන්නා\n[Eb]රාජාති [F]රජිඳුනිවේ [Gm]හෝසන්නා\n\n[Gm]මිහිකත කම්පා කර ජය ගොස රැව් දෙන්[F]නා\nඅහස් ක‌ඳෙන් ආසිරි මල් [D]වැස්ස වහින්[Gm]නා\n\n/[Gm] / [F] / [Eb] / [Gm]\n\n[Gm]දෙවිඳුන් දුන් උත්තම වචනය ගෙන එන්[F]නා\nඔබ අප ගැලවුම්කරුව[D]ාණන්ව උපන්[Gm]නා\n\n\n\n[G]අදමිටු පාලක මහ සිහ[C]සුන් දෙදරන්නා\n[Gm]‌‌ජේසු රජුනි ඔබය මිනිස් [Eb]කිරුළ දරන්[Gm]නා\nදේව [F]පුතුන් වඩින්[Gm]නා\n\nහෝසන්[Gm]නා...\nහෝසන්[F]නා...\nහෝසන්[Eb]නා...\nහෝසන්[Bb]නා...\nහෝසන්[Gm]නා...\nහෝසන්[Cm]නා..\n[Eb]දේවාති [F]දෙවිඳුනිවේ [Gm]හෝසන්නා\n[Eb]රාජාති [F]රජිඳුනිවේ [Gm]හෝසන්නා\n\n\n\n\n      (මේ ගීතිකාවම අංක 141ත් තියනවා)\n",

      "content": "නිලම්බරේ දෙව් පුතුන් විහිදේ\nස්වාමීන්වහන්සේගේ නාමය රැවදේ\nරාවේ හොරණෑවේ ඊ්ට එක් වේ\nජේසුස් ස්වාමි පැමිණේ\n\nහාලේලුයියා ජේසු තේජානුභාවනා\nමා උදෙසා එන ඒ දවසේ...//\nමා ස්වාමීන් සමගා ඒ ශුද්ධ රටටා\nතේජසින් මා යවනා...//\n\nකල්වාරියේදී ලත් ලේ ආලේපේ\nක්‍රිස්තු මේ වාරේ තේජාන්විත ‌වේ\nකල් නෑර බිරිඳු බෙත්ලෙහෙමේ\nරාජාති රජුසේ ඒ...\nහාලේලුයියා ජේසු.....\n\nඊමේ ආශාවෙන් බෝ යාච්ඥාවේනී\nශුද්ධාත්මයෙන් පූර්ණ නිර්මල වී\nශුද්ධවතුන් රාශි මධ්‍යාකාශේ\nඒ රාජා සම්මුඛ වේ....\nහාලේලුයියා ජේසු....\n\nනා නා සෝ දුක් පීඩා මාර්ගයේ ඇති\nවින්ද මනාලිය සන්තේශෙනි\nමල්කම් කලා වූ ඒ සෙලෙන්  සෑදී...\nජේසු රාජා හා යන්නී...\nහාලේලුයියා ජේසු....\n",

      "content": "හිමි පාද වෙත ආවා කරුණා පිරි ජේසුනි\nඔබ ප්‍රේමය දුටුවා දේව අභිමුඛයේ....//\n\nසහනය දෙනු මා ස්වාමිනි\nවෙහෙස සංසිඳුවාලා...//\nකුරුසිය මගේ සැනසිල්ලයි\nසුවයෙන් මම එහි රැඳෙමි...//\n\nහඬ ගසනු මහා වෙත කීවා\nසැම පීඩා වේලෙහි දී....//\nවිමසා බලා ආදරයෙන්\nපවසයි මට ආදරයෙන්...//\n\nමා ස්වාමි මා ස්වාමි මා අත්නාරී\nසැම නින්දා කාලයේදී...//\nඋසුලයි සැම මා වෙනුවෙන්\nදෙව් ශක්තිය දෙනු මා හටා...//\n\nඔබගේ දෙසට නෙත් යොමාලා\nලැජ්ජා නොවෙමි ඔබගෙන්...//\nඔබගේ මුහුණ මහිමයෙන්\nසැමදා මට හිමි වේවා...//\n",

      "content": "අලුයම වේලේ බීජ බෝ යහපත පුරවා\nදවාලේ සවසත් ඒමෙන්\nකපන ඒ කාලයේ දෑත තුටින\nසිත් රැස්කර ගෙනෙමු ප්‍රීති සංතෝසින්...\n\nප්‍රීති සංතොසින් ප්‍රීති සනංතොසින්\nරැස් කර ගෙන මු ප්‍රීති සංතොසින්...//\n\nහිරු රැස් අතරේ වපුරා\nසෙවනේ වැසි සුළඟේදී බිය නොගෙන\nඉක්මනින් කැපුමත් වෙහෙසත් ඉකුත්වී\nරැස්කර ගෙනමු ප්‍රීති සන්තොසින්\nප්‍රීති සංතොසින්....\n\nඒ නිසා කඳුළින් හිමිගේ නමින්\nගොස් වපුරන් අමාරු පැමිණේ නමුත්\nකඳුළු සිදී ගොස් කැඳවයි හිමි තොස්\nරැස්කර ගෙනෙමු  ප්‍රීති සන්තොසින්.....\n",

      "Capo": 0,
      "content": "ඔසවා යනසේ පැටවුන් රාජාලියා උගේ\nපියාපත් මත තබා... මතු ඔබෙ දිවිය පුරා\nගෙනයමි මම උබ කරෙහි බලා විමසා...\n\nමා හදවත සාමයෙන් සපිරේ ඔබ ඇත\nපැවතීමේ දිවිය පුරා..මා...\nඔබ සුරැකි දෑත් ඇත් ඒවටකොටමා මම ඔබ\nගැන තිරලෙස සිටිනෙමි අදහා...\n\nඔබ සුරැකි දෑත් අතරේ තබා නළවන\nබිලිඳෙකු මෙහි ආත්මෙ මාගේ\nඔබ ගෙන යා ඇත දිගු කලක් පුරා මා\nසොම්නස හා දොම්නස මුසු දිවි ගමනක්..\n\nදිස්වෙයි හද මැද දුබලකම් මාගේ දිවි\nගමනේ පරාජය දැනේ මට දැනේ...\nඔබ සෙමින් නැගිටුවා මා එසැවූයේ\nනොමඟ දිවි මගේ හැපී වැටී සිටිමා...\n\nඋස්කඳු පසෙකට යන්න සැලසුවෝ දිය\nදහරට ගලනා මාවත සැලසුවෝ\nතද කුණාටු මැද ඔබ සිටියේ රැඳී\nමා..හා..සුරැකි මාවතේ\nගෙනයනු දැනුදු දැනේ...\n\nඔසවා යනසේ...\n",

      "Id": 79,

      "Capo": 0,
      "content": "මැවුම්කාර දෙව්තුමා\nමට ප්‍රේම කල නිසා\nමිනිස් වෙසින් වැඩියා\nමේ ලොවට මා නිසා..//\n\nපව්කරුවන් ගැලවන්නට\nපාපෙන් ශාපෙන්\nදෙව්තුම බිහිවුනා\nලොවට ජේසුස් නාමෙන්\nලොවට ජේසුස නාමෙන්...\n\nමිනිසෙකු ලෙස යහපත කොට\nයෞවන වයසේ\nනිහඩ මුවිනි දරා ගත්තෙ\nඒ රුදු කුරුසේ\nගත්තෙ ඒ රුදු කුරුසේ....\n\nකුරුසිය මත ඇන ගැසුවේ\nකල්වරි කන්දේ\nජේසු සමිදු අප හින්දයි\nමරණය වින්දේ\nඒ මරණය වින්දේ...\n\nකුරුසිය මත........\n\nමරණ බලය පරදවන්නේ\nඉන් ජය ගත්තූ\nප්‍රථම ඵලය වුණා ස්වාමි ජේසුස් ක්‍රිස්තු\nස්වාමි ජේසුස් ක්‍රිස්තු.....\n\nසගපුර දෙව් සිංහාසනේ\nදකුණුපස සිට\nමැදහත්කම් කරණවා අද ජේසු අපහට\nඅද ජේසු අපහට.....\n\nකිතු පරපුර බිහිකරන්න\nමෙ ලොව මුළුල්ලේ\nඅක් වැල් බැද එක්සත් වෙමු සමිදු තුරුල්ල‌ේ\nකිතු සමිදු තුරුල්ල‌ේ",

      "content": "අබ්බා පියාණනී ආදර දෙවිඳුනි\nගැලවුම්කරුතුමනි\nශුද්ධවු ආත්මයෙනි\n\nවෙන්වී මා ඔබගෙන් අඳුරේම සිටියදි\nඔබතුම මා සෙව්වේ\nලයෙහි හොවා මා සිපගෙන සැමදා\nමට සෙවනක් වුයේ\nස්තූති ඔබට ස්තූති\n\nපහත්ව සිටිනා වැටි වැටි ඇවිද්ද\nමා හට පෙම් කෙරුවේ\nකඳුලැල් පිසදා මා අත අල්ලා\nනිසි මඟ පෙන් වුයේ\nස්තූති ඔබට ස්තූති\n\nකසල ගොඩේ සිටි මාව ඒසෙව්වා\nපේ%මයෙ දෙව් සමිඳේ\nකල්වරි රුධිරේ මා නිසා වගුරා\nමා පව් සේදූවේ\nස්තූති ඔබට ස්තූති\n\nදිවා රැයෙහි ඔබ මා සිටිමින්\nසැමදින රැකගත්තේ\nකිසිදින කිසිවිට මා අත්නාරින\nඔබ හට මහිමයවේ\n\n\n",

      "content": "ලේ බලකොටුව තුළ මා සැගවෙන්නේ\nකිසි විපතක් නෑ වන්නේ කිසි නපුරක් නෑ වන්නේ...//\n\nජේසුස්ගේ ලේ වලින් සේදු නිසා සාතන් ලංවන්නෙ නෑ\nප්‍රේමයෙන් කුරුසියෙ දිවි දීලා පාපයෙන් ජය ගත්තා...//\n\nමගෙ උපකාරය ඔබ නේද නිතරම මා රැක දෙයි..//\nලෝකයෙ සිටිනා ඔහුට වඩා මා දෙවිදුන් බලවත්...//\n\nදෙව්දුන් ගැලවීමෙ ආලෝකයයි කාටද භයවන්නේ...//\nමා ජීවිතයෙ බලය ඔබයි කාටද භයවන්නේ...//\n\nමව දරුවව අමතක කෙරුවා අමතක නොකරන්න‌ේ\nඑඩේරා ලෙස මග පෙන්වන්නේ\nආලේපය දෙන්නේ...//\n\nකදු පර්වත සැම පහවී යයි කරුණාව පහව නොයයි...//\nනිම් නැති ප්‍රේමයෙන් ඇදගන්නේ මා ඔබෙ තුරුළටමයි.....//",

      "content": "ජේසුස්ගේ ප‌්‍රේමේ විශාල පුදුමය වේ\nමහ සාගරයත් සැම තරුවලටත්\nඋසස්ය කදු සැමටත්....//\n\nජේසුස්ගෙ නම අනගී - ලොකාලෝකය වෙයි\nආලෝකය බබළයි - ජීවිතයම එළියයි\nඅදුරෙන් නැත මග එළියෙම ඇවිදින\nවෙමු අපි සෑමදෙනා...//\n\nදෙවිදුට අයිති සැමා ඉදිරියෙ පා තබනා\nජීවිතයද රැගෙනා යන්නෙමු ප්‍රීතියෙනා\nසැබෑව සාමය එතුමය සදහට\nඅදහමු බැති සිතිනා..//\n\nබලය ඉතා පුදුමයි - ලොව පාලනය කරයි\nරජුන්ගෙ රජ එතුමයි - ජීවිතයම එළියයි\nඉර සද තරු සැම මැවිල්ල නිතරම\nසමිදුට කීකරුවෙයි...//",

    {
      "Id": 126,
      "author": "",
      "Capo": 0,
      "content": "[Gm]කස පහරින් තැලුනේ - [F]ඔබගේ ගත සමිදු[Gm]නේ\n[Eb]ඒ නිසයි මට ඇත්[F]තේ - අද [Eb]සුවය ස[C]මාදා[Gm]නේ\n[F]වින්දේ කුරුසි[Gm]යේ වේද[Eb]නාවන් මා නි[F]සා\nපුද [Dm]දුන්නේ ජීවි[Eb]තේ [F]මාගේ [D]පව් උදෙ[Gm]සා...\n\n[F]කටු ඔටුනින් [Gm]සිරස සැරසුදා\n[Eb]ඉසිලුවේ මගේ දුක් [F]ගින්දරයි\nකුරුසිය [Eb]උරමත තබා දැ[D]රූවේ\n[Cm]ඔබ මගෙ දිවියේ [D]පව්බ[Gm]රයි\n[Gm]සැමට වඩා මා හැඟි ප්‍රේමය තුල\n[Eb]ඔබ කුරුසියෙ පිදු [F]යාගයයි\nඑතුලින් [Eb]මා නිබඳවම ද[D]කි⁣න්නේ\n[Cm]ඔබෙ අති උත්තම [D]ප්‍රේම[Gm]යයි...\n\n[Gm]කස පහරින්......\n\n[F]ඇණ පහරින් ගත [Gm]සිදුරු වෙලා\n[Eb]ගැලුවේ නිර්මල [F]රුධිරයයි\nඒ ලෙය [Eb]තුළ ඇති බලය නි[D]සා මා\n[Cm]ජයගන්නේ [D]ජීවිත[Gm]යයි\nණය කරුවෙකි මා පිදු ඔබ දිවියට\n[Eb]මිලයක් ගෙව්මට [F]කිසිත් නැතී\nපිළිගන් [Eb]මාගේ තැළුණු බි[D]දුණු හද\n[Cm]එය මට දිය හැකි [D]එකම දෙ[Gm]යයි....",

    {
      "Id": 150,
      "author": "",
      "Capo": 0,
      "content": "හෝසන්නා..හෝසන්නා..\nහෝසන්නා...හෝසන්නා..\nහොසන්නා...හොසන්නා...\nදේවාති දෙවිඳුනිවේ හෝසන්නා\nරාජාති රජිඳුනිවේ හෝසන්නා\nදෙවිඳු නමින් වඩින රජුන් ආසිරි වේවා\nජීවමාන පුතුනි ඔබට පැසසුම් වේවා...\n\nලාසරස්ට ප්‍රාණය දුන් ජේසුනි සමිදේ\nජීවමාන රජුන් ඔබයි ජේසුනි සමිදේ\nදෙවිඳුන් අපහට දුන් රන් කරඬුව වැන්නේ\nසමිඳු රජුන් පුතුන් ඔබයි ජේසු රජුන්නේ\nඅසරණයට ජල දහරා ගඟුල ගලන්නා\nඑවන් ගඟුල ජේසුනි ඔබ හට හෝසන්නා\nදේව පුතුන් වඩින්නා....\n\nමිහිකත කම්පා කර ජය ගොස රැව්දෙන්නා\nඅහස් තලෙන් ආසිරි මල් වැස්ස වහින්නා\nදෙවිඳුන් දුන් උත්තම වචනය ගෙන එන්නා\nඔබ අප ගැලවුම්කරුවාණන්ව උපන්නා\nඅදමිටු පාලක මහා සිහසුන් දෙදරන්නා\n\nජේසු රජුනි ඔබය මිනිස් කිරුල දරන්නා\nදේව පුතුන් වඩින්නා...\n\n\n\n\n\n      (මේ ගීතිකාවම අංක 10යෙත් තියනවා)",

      "content": "{c: Part}\n{sot}\n------------------------\n| Fm - - Eb - - C# - - Cm |\n| C# - - Eb - - Fm - -   |\n------------------------\n{eot}\n\n\n[Fm]ආදරෙයි මගෙ ජේ[Eb]සූ\n[Cm]ජීවිතේ මගෙ ඔබ ජේ[Fm]සූ...//\nමා දිවි[Eb]යේ අරුත ඔ[G#]බයි\n[Fm]ජීවිත[C#]යේ සතුට ඔ[G#]බයි...\n[Eb]හදවත සනසන [Cm]සුවය ඔ[Fm]බයි\nමගෙ [Eb]හදවත සනසන [Cm]සුවය ඔ[Fm]බයි..\n\n[Fm]ආදරෙයි මගෙ ජේසූ....\n\n[Fm]ගී ගයමින් පසසමු සැමදා\n[C#]මුළු දිවියම ඔබ බව පව[Fm]සා..\n[Fm]ගී ගයමින් ප[C#]සසමු සැම[Eb]දා\nමුළු දිවියම ඔබ [C]බව පව[Fm]සා....\nජීවිතයම ක[C]ඳුලින් පිරිලා\n[Bbm]හඬමින් තනිවූ [Eb]මා හද [G#]සනසා..\n[C#]ආදරයේ මහි[Bbm]මය පව[Eb]සා\nරැකගත් සමිදුනි ඔබ [C]පසසමු [Fm]සැමදා\n[C#]ආදරයේ මහි[Bbm]මය පව[Eb]සා\nරැකගත් සමිදුනි [C#]ඔබ ප[C]සසමු සැම[Fm]දා\n\n[Fm]ආදරෙයි මගෙ ජේ[Eb]සූ...\n\n[Fm]මා සතුටින් දිවි ගෙවමි සදා\n[C#]ආදරයට ඔබෙ [Eb]තුරුළු වෙ[Fm]ලා\nමා සතුටින් දිවි [G#]ගෙවමි ස[Eb]දා\nආදරයට ඔබෙ [C]තුරුළු වෙ[Fm]ලා\n[Fm]පාපය අඳුරින් [C]දුබල වෙලා\n[Bbm]සැනසුම් සුසුමන් [Eb]අහිමිව [G#]හැඬුවා\n[C#]ඔබෙ සුදු දෑතින් [Bbm]ඔසවා[Eb]ලා\nරැකගත් සමිඳුනි ඔබ [C#]පසසමු [Fm]සැමදා..\n[C#]ඔබෙ සුදු දෑතින් [Bbm]ඔසවා[Eb]ලා\nරැකගත් සමිඳුනි [C#]ඔබ පස[C]සමු සැම[Fm]දා..\n",

      "content": "නැතුවට සමිදේ ලොව යසසිරු පිරි දෝත පුරා\nඔබ සිටියා මා හදතුල සැමදා කිරුල දරා\nජීවිතයේ තිත්ත රසේ ඉඩ අහුරා\nදුක හා කඳුලැලි ඔබ දැරුවා මගෙ දිවිය පුරා\n\nදිව රෑ නොබලා තුන්තිස් පැය මා හිඳින්නෙමි\nවැර ඇති සිතකින් ජීවිතේ පිය නගන්නෙමී\nඋසුලාගන්නට බැරි දුක් පීඩා විඳින්නෙමී\nඑකම වදනකින් මා සනසනු මැන නැවතත් මා පිය නගන්නෙමී\n\nනැතුවට සමිදේ ලොව යසසිරු පිරි දෝත පුරා\nඔබ සිටියා මා හදතුල සැමදා කිරුල දරා\nජීවිතයේ තිත්ත රසේ ඉඩ අහුරා\nදුක හා කඳුලැලි ඔබ දැරුවා මගෙ දිවිය පුරා\n\nඅඳුරෙහි සරනා දිවියට එළියක් ගෙනෙන්නට\nවෙහෙසෙන දනහට වියගහක් වී හිඳින්නට\nමට බැරි විටදී කලකිරී ඇද වැටෙන විට\nසමිදුනි එනුමැන පටු මාවත තුල මා සමගින් පිය මනින්නට\n\n\n",

      "Id": 230,
      "author": "",
      "Capo": 0,
      "content": "කවුරු වුවත් ඔබ\nකොතැන වුවත් ඔබ\nමගේ සහෝදරයා\nඔබ මගේ සහෝදරයා\n\nපට පිළ ඇන්දත් වැරහැලි ඇන්දත්\nඔබ මගෙ සොහොයුරෙකි\nසිතුමට පැතුමට පටහැනි වූවත්\nඔබ මගේ සොහොයුරෙකි\n\nජාතිය කුලපන මොනවා වූවත්\nඔබ මගේ සොහොයුරෙකි\nමිනිස් ලොවෙහි වෙසෙනා ඔබ සැම දෙන\nමගේම සොහොයුරෙකි\n\nකවුරු වුවත්...\n\nඔබේ දෙනෙත් අග වැටෙන කදුළු දැක\nමටද කදුළු එනවා\nඔබේ සිතේ බර මටද දැනෙන විට\nමසිත ද බර වෙනවා....\n\nඔබේ හදේ ඇති දුක වැටහීමෙන්\nමගේ හද තනියනවා\nඔබේ දයාබර අත අල්ලා මා\nඔබ හා එක්වෙනවා....\n\nකව්රු වුවත්....\n\nඔබේ හැඩය ගැන ඔබේ පැහැය ගැන\nනැත මා විමසන්නේ\nඔබේ අනුව ගැන ඔබේ වැඩිය ගැන\nනැත මා විමසන්නේ...\n\nසොහොයුරු කැල්මෙන් ඔබ නෙතු බැලුමෙන්\nමා ඔබ සලකන්නේ\nකවුරු වුවත් ඔබ කොහේ වුවත් ඔබ\nමට සොහොයුරු වන්නේ....\n\nකනුරු වුවත්.....\n",

      "content": "පිණි පොද ආසිරි තරු මල් වාස්සේ\nපුතෙක් ඉපිද ඇත මැදියම් අදුරේ\nඑන්න යන්න තරු එළිය දිගේ\nගයමු වයමු දෙවිතුමන් සෙනේ...//\n\nහාලේලුයියා...////\n\nසාම සුවය ලෝ දිලිදු දනන් හට\nදුන් බව සුරගුන් පවසන්නේ...//\nරජවරු එතුමන් දෙපා වදින බව\nවන බඔරුන් ගී මුමුනන්නේ...//\n\nහාලේලුයියා...////\n\nසෙනෙහෙ සිතින් පව් කිලිටි නසන්නට\nදෙවිදුන් මනුබව අරගන්නේ...//\nඑන්න යන්න අපි අත්වැල් බැදගෙන\nනත්තල දොර ලග හිනැහෙන්නේ...//\n\nපිණිපොද ආසිරි.....\nහාලේලුයියා........",

      "content": "සිත්න් දිලිදු විය හැකිනම්\nසගලොව දකින්න හැකිවේ\nදුකෙන් පෙලෙන සිත් ඇත්නම්\nසමිදුන්ගෙ සහනය ඇතිවේ\n\nජේසුනී මගෙ ජේසුනී\nදිලිදු සිතින් දුන මැනවී\nජේසුනී මගෙ ජේසුනී\nසනසාලුව මැනවි...\n\nසතින් මෘදු විය හැකිනම්\nමිහිපිට සෙත ලබන්න හැකිවේ\nදමිටු කමට ප්‍රියවී නම්\nපිරිපුන් බව හද තුල ඇතිවේ....\n\nජේසුනී මගෙ ජේසුනී\nමෘදු සිතක් දුන මැනවී\nජේසුනී මගෙ ජේසුනී\nදමිටු සිතක් දුන මැනවි\n\nදයාවන්තකම ඇත්නම්\nදයාව ලබනට හැනිවේ\nසිතින් පවිත්‍ර වී නම්\nදෙවිදුන් දකින්න හැකිවේ\n\nජේසුනී මගෙ ජේසුනී\nමෘදු සිතක් දුන මැනවී\nජේසුනී මගෙ ජේසුනී\nපවිත්‍ර කල මැනවී",

      "content": "මගෙ ජීවනයම  ඔබවේ\nඔබ මගෙ රැකවරණය වේ\nගැලවුම් මාර්ගය සත්‍යය ඔබමයි\nසැබවයි සමිදේ සැබවයි\n\nආවේ ජීවනයම දෙන්නයි\nවැඩි වැඩියෙන් දෙන්නයි\nසැම කල දිවි දෙන ඔබ බලයයි\nමගෙ දිවි ඔබ නතුවෙයි\nඔබ ඇති අය වෙත ජීවනයයි\n\nනැති අය වෙත මරණේ\nනොබියව නොසැලී සිටිනට සැමකල්\nකැදවනු මගෙ නම කියලා\n\nමගෙ ජීවනයම.......\n\nජලයේ මැදිනා යන කලටා\nඇත මට ඔබෙ පිහිටා\nමැදිනා යන කල මහ ගංගා\nනොගිලයි මා උඩිනා\nගිනි මැද යන කල මා නොදැවේ\nගිනි දැල් නොම ඇවිලේ\nඔබ මගෙ දෙවිදේ බිය සැක නොදැනේ\nසතූති දේ සමිදේ ස්තූති වේ...\n\nමගෙ ජීවනයම.......",

    {
      "Id": 285,
      "author": "",
      "Capo": 0,
      "content": "\nබිඳුනු සිතක් ඇති තනිවුනු මොහොතක\nබලාපොරොත්තුද සුන්වේ\nජීවිත දහිරිය මැළවුනු මොහොතක\nමොරගසමි මම ජේසුනී\n\nදිරිය ගන්නම් දුක කියන්නම්\nහිමියනේ ලං වෙන්නම්\nදිරිය ගන්නම් දුක කියන්නම්\nඔබ වෙතට ලං වෙන්නම්\nසෙනෙහේ වෙනවද, සනසවනවද,\nඅනේ මා ප්‍රිය ජේසුනේ\n\nජේසුනී ඔබමලු ප්‍රේමය මේ ලොව\nමා උදෙසා දිවි දුන්නා වූ\nඒ ප්‍රේමය තුළ නිමක් නොමැති බව\nහැ‌‌‌ඟෙනවා මා ප්‍රිය ජේසුනේ\n\nමවත් ඔබමයි, පියත් ඔබමයි,\nමිතුරාටත් ඔබමයි\nජීවිතේ සැප දුකෙහි පතනා\nනාමේ ජේසුස්මයි\nනාමේ ජේසු ‌ජේසු... මගේ පැතුම ඔබයි...\n\n\n",

      "content": "{c: Part}\n{sot}\n👇Em.. C..G..D\n------------------------\n| C - - G - - Am - - |\n| F - - G - - C - -   |\n------------------------\n{eot}\n\n[C]නමදින්නම් මා ඔබ සමි[Dm]දේ\n[G]අබ්බා පියාණ[C]නී\nඉල්ලන්නම් වරමක් ඔබෙ[Dm]න්\n[G]ඔබ මාගෙ හඬ අසනා බැ[C]වින්\n\n[Am]ඔබේ වචනයේ ලියලා තිබෙනා\n[Em]මේ පොළවේ උරුමය ලබනා\n[F]ලෙස මා සකසන් නැයි කි[G]යා\n\nඔබ මට [C]ආශිර්වාද කරන්න\nමගෙ [Dm]සීමාවන් ඔබ පුළුල් කරන්න\n[F]ඔබගේ අත දිගු කොට මට දුක්\n[G]නොවන සේ මා රැකගනු මැන\n\n[C]පොරොන්දු දුන්නේ ඔබයි සමි[Dm]ඳේ\n[G]එය කඩන්න ඔබ මිනිසෙකු නො[C]වේ\n[D]වහල්කමෙන් හා පීඩා[Dm]වෙන්\n[G]ඔබ මා දිවි මුදනා බ[C]ැවින්\n\n[Am]මම තව දුර්වල නෑ කියලා\n[Em]මම තව අසරණ නෑ කියලා\n[F]අන් සියලු දෙනා මට පවසන [G]සේ\n\nඔබ මට [C]ආශිර්වාද කරන්න\nමගෙ [Dm]සීමාවන් ඔබ පුළුල් කරන්න\n[F]ඔබගේ අත දිගු කොට මට දුක්\n[G]නොවන සේ මා රැකගනු මැන\n",

      "content": "{c: Part}\n[Gm]……[Eb]……[Gm]……[F]……[Gm]\n\n\n\n[Gm]සුවය ගලා එන[F]වා [Eb]ජේසුගේ [F]ලේ තු[Gm]ළින්\nමිදීම ගෙන දෙන[F]වා [Eb]සමිඳුගේ [F]ලේ තු[Gm]ළින්\n[Gm]මා සුව [F]කරනා මට අත [Eb]ගසනා\nජේසුනි [F]ඔබ හට [Dm]ස්තුති වේ[Gm]වා\nමා සුව [F]කරනා මට අත [Eb]ගසනා\nසමිඳුනී [F]ඔබ හට ස්[Dm]තුති වේ[Gm]වා\n\n\n[Gm]දෙවිඳුනී ඔබ අභි[Cm]යස මා ඉන්නේ\n[F]මුළු ජීවිතය පු[Bb]රා\n[Gm]ඔබ කළ යහපත් [Cm]දේ සිහිවන විට [F]ස්තුති පුදනෙමි සැම[Bb]දා\n[Eb]ස්තුති පුද[F]නෙමි සැම[Gm]දා\n\n\n[Gm]ආලේපය දෙන[F]වා [Eb]දෙවිඳුගේ [F]හස්ත[Gm]යෙන්\nගිනි මෙන් වැගිරෙන[F]වා [Eb]දෙවිඳුගේ [F]ආත්ම[Gm]යෙන්\nමට මඟ [F]පෙන්වා මාව රැ[Eb]ගෙන යන\nශුද්ධතුනි [F]ඔබහට ස්[Dm]තුති වේ[Gm]වා\n\n\n",

      "content": "පොරොන්දු වූ දේශයයි\nපොරොන්දුවේ දේශයයි\nඇතුළුවන්න හිමි කරගන්න\nපොරොන්දුවේ දේශයයි..//\n\nවහල් බැම්මෙන් පුදා නගමින්\nසතුරු බලයන් නසා දමමින්\nපවස කුසගිනි නිවා දමමින්\nදෙවිදු සිටියා ඔවුන් දරමින්..\n\nපොරොන්දු වු දේශයයි...\n\nදෙවිදු දෙන බව දිවුල දේශය\nආදි පියවරු දුටුව දේශය\nඅපව ගලවා ගෙනා දේශය\nඑකට එක්වී දිනමු දේශය\n\nපොරොන්දු වු දේශයයි....\n\nදිවුල දේශයෙ අපව තබමින්\nදෙවිදු ඇත අද අපත් සමගින්..//\nබලය පතුරා යකුන් බදිමින්\nදිනමු දේශය සමිදු යදිමින්..\n\nපොරොන්දු වූ දේශයයි.....",

      "content": "\nමුළු ලෝතලේ පීරමින් සෙව්වා\nනොසිතු ලෙසේ ඔබව හමුවූවා\nකිසිදාක නිම නොවනා ඔබේ හදින් ගලනා\nවෙන කිසිවෙකු තුල ඒ ආදරේ නැති\n\nඔබ පමණයි මට ආදරේ කලේ\nඔබ පමණයි මා ගැන සිතුවේ\nඔබ පමණයි මගේ ලඟින් සිටියේ\nඔබ පමණයි ජේසුනී ඔබ පමණයි\n\n\nවේදනා සිත දරා ජීවිතේ තනි වෙලා\nසිටිය මා ආදරෙන් කැඳවලා\nජීවිතේ ඇති තුරා නැ උතුම් යැයි කියා\nමේ තරම් ප්‍රේමයක් හමුවෙලා\n\n\nපාපයේ වියැලිලා වේදනා නැඟෙන මා\nහද ඔබේ පාමුලේ රඳවලා\nකුරුසියේ වේදනා දැරුවේ ඔබ මා නිසා\nඒ ලෙයින් තෙමනු මැන මා සදා\n",

      "content": "(පාට් එක මා සැඟවෙන ස්ථානය ඔබයි)\n\n[E]මා සැගවෙන ස්ථානය ඔ[C#m]බයි\n[E]බිය පැමිණෙන [C#m]විට ඔබ මා [F#m]රක්ෂා කරයි\nමිදීමේ [A]ගීතිකා වලින් [B]ඔබ මා වට ක[E]රයි //\n\n\n\n[E]දෙවිදුන් කෙරෙහි බ[A]ලා සිටින්නෙ[F#m]මී\n[B]ඔබ මා ශක්තියයි දෙවි[E]දේ\n[C#m]රාජාලියෙකු සේ [A]පියඹා නගින්නෙ[F#m]මී\n[B]ඔබ මා ශක්තියයි දෙවි[E]දේ\n\n\n\n[E]දෙවිදුන් කෙරෙහි බ[A]ලා සිටින්නෙ[F#m]මී\n[B]ඔබ මා ශක්තිය අළුත්කර[E]යි\n[C#m]රාජාලියෙකු සේ [A]පියඹා නගින්නෙ[F#m]මී\n[B]ඔබ මා ශක්තියයි දෙවි[E]දේ\n\n\nදිව [A]යන මුත් වෙහෙස නොවෙ[G#m]යි\nඇවි[A]දින මුත් ක්ලාන්ත නො[G#m]වෙයි //\nඔබ මා [A]ශක්තියයි දෙවිදේ\n[C#m]ශක්තියයි දෙවිදේ\n[B]ඔබ කෙරෙහි බලා සිටින්නෙ[E]මි\n\n",

      "content": "[F]....[Gm].....[Dm].....[C]..\n[F]......[Gm].....[Bb]....[C].....[F]\n\n\n\nසර[F]ණක් නැතිදා කඳු[Am]ලින් පිරි[Dm]ලා\nසිටි[Bb]යා මා තනිවි[C]ලා\nඔබ [F]මා කැඳවා අත [Am]දිගු කර[Dm]ලා\nහඬ [Gm]ගැසුවා මගේ නම කි[C]යා\nඔබ [Dm]මගෙයි කි[Am]යා මම [Gm]රකිමියි කි[C]යා\nඔබ [Dm]තුරුලේ හො[Am]වා\nඔබ [Gm]මා සැනසු[C]වා ජේසු[F]නී\n\n[F]හද වේදනා [Dm]මා දව දවා\nඅන්ධ[Gm]කාරේ මා තනි වු[C]නා\n[F]එ් වේදනා [Dm]කුරුසේ ද[Am]රා\nඔබ [Gm]මා ඉන් නිදහස් ක[C]ළා\n\nමගේ [Bb]කඳුලැල් නි[F]වා [Bb]මා සනස[C]වා\nරැක[Bb]ගත්තේ ඔ[C]බයි ජේසු[F]නී\n\n[F]පවුකාර වු [Am]මගේ ජීවි[Dm]තේ\nඔබේ [Gm]ලෙයිනුයි සුවපත් ක[C]ලේ\n[F]වචනෙන් මගේ [Am]පවසමි කෙ[Dm]සේ\nදෙවි[Gm]ඳුනි ඔබේ ආද[C]රේ\n\nමගේ [Bb]හදවත පු[F]රා [Bb]ඔබේ නම ලි[C]යා\nනම[Bb]දින්නෙමි ස[C]දා ජේසු[F]නී\n\n\n",

      "Id": 340,

      "content": "මට ඇසුනු ගීතය\nදාවිත් ගැයු එ් ගීතය\nවිනා වයා ඔබ හට හදවතින්\nඔහු ගැයු එ් ආත්මයෙන්\nඔබ ප්‍රිතිමත් වෙයි නිතින්\nමමද අද ගයමි හාලේලුයියා\n\nහාලේලුයියා\n\nඅතිශුද්ධ ප්‍රේමණීය ඔබනම් අලංකාරය\nඔබම වේ සදාතනික ප්‍රේමය\nපොළෝතලෙත් අහස් ගැබත්\nඑහි ඇති සියල්ලමත් මැවු මැවුම්කරුට\nහාලෙලුයියා\n\nහාලේලුයියා\n\nමගේ අයතුකම් හැම\nපාප බර සියල්ලම\nඔබේ දයා ගුණෙන් මට කමා කලා\nමා නිසා මැරෙන්නට\nතරම් මෙමා වටීනෙද\nමගේ පියාණනී හාලෙලුයියා...\n\nහාලේලුයියා\n\nකරුණවේ දොරටුව වැසීයන්න ප්‍රථමව\nසියල්ලට ගැලවිම දුන මැන\nඔබ නැවත එන විට\nඔබ සමග යන්නට\nසැම කල්හි බලා ඉ හාලෙලුයියා..\n\nහාල‌ෙලුයියා\n\n",

      "content": "සග ලොව සිහසුනේ ඔබ වැඩසිටී\nඔබගේ මුහුණ ලෝහිතංක මැණික් සේ\nසිහසුන වටකරින් දේදුනු පැහැයයි\nඔබේ පාමුල වැඳ වැටෙමින් ප්‍රශංසා කරම්\n\nශුද්ධයි ඔබ //\nරෑ දහවල් නොවතිමින්\nගායනා කරම්\nශුද්ධයි ඔබ //\nරෑ දහවල් නොවතිමින්\nප්‍රශංසා කරම්\n\nසුදෝ සුදු වතින් සැරසී සිටිමින්\nවැඩිමහළුන් ඔටුනු තබා වැඳ වැටේ\nගිනි පහන් සතින් ආත්මයන් දිලේ\nසිටියාවු ඉන්නාවු මතු එන දෙවි‌ඳේ\n\nශුද්ධයි ඔබ ශුද්ධයි\nසදාකල්ම ජීවත් වන මැවුම්කරු ඔබයි\nගැලවුම්කරු ඔබයි\n",

      "Id": 367,
      "author": "",
      "Capo": 0,
      "content": "දෙවි සමිදෙ ඔබ මා තුළ නිති වැඩ වසනා හින්දා\nනොසාලෙන්⁣නේ මා වට කොට ඔබ සැරිසරනා හින්දා\nසැඟවෙන්නේ ඔබ ලඟ මට ඇති රැකවරණය හින්දා\nසැනසෙන්නේ ඔබ මා ලඟ සිට මා සනසන හින්දා..//\n\nනමදින්නේ ඔබවන් දෙවිඳෙකු ⁣ලොව තව නැති හින්දා\nනොසැලෙන්නේ ඔබ මා අත අල්ලා ගෙන යන හින්දා\nහිනැහෙන්නේ ආත්මය ජීවය ඔබ සපයන හින්දා\nනොතැවෙන්නෙ අවැසි සැමදේ ඔබ සපයන හින්දා..//\n\nසුවදෙන්නේ ඔබ නම තුළ ඇති බලවත්කම හින්දා\nජය ගන්නේ ජීවිතයට ඔබ මඟ පෙන්වන හින්දා\nපිබිදෙන්නේ ආත්මය ජීවය ඔබ සපයන හින්දා\nනොවැටෙන්නේ ඔබ මා, ඔසවා ගෙන යන හින්දා..//\n\nදෙවි සමිදෙ....",

      "content": "[Em]ස්වාමින් මාගේ එඬේරා[D]වේ\nමට [Bm]දැන් කිසි හිඟයක් නො[Em]වේ..//\nනිසි [D]මාවතේ මා [C]ගෙනයමින්\nමගෙ [G]ආත්මෙට [D]සැනසීම[Em]⁣වේ...//\n\n[Em]ගොදුරු බිමේ මා [G]ගෙනයයි\nනිශ්[Am]චල දිය අසල ත[Em]බයි..//\n[D]මගේ ආත්මය [C]ප්‍රාණවත් කරන\n[Bm]ස්වකීය නාමේ ඔ[Em]බයි..//\n\n[Em]දමිටු කමේ මා[G]වතමයි\nමර[Am]ණයෙ බල [D]එහි නොරැ[Em]ඳේ..//\n[D]ඔබගේ බලයෙන් [C]ඔබගේ වචනෙන්\n[D]මට සැන[Bm]සිල්ල ලැ[Em]බේ...//\n\n[Em]අභිෂේකය දෙවි[G]ඳුන්ගේ\nමා [Am]දිවි තුළ උතුරා [Em]යයි..//\n[D]යහපත්කම ඔබෙ [C]කරුණාවද ඔබෙ\n[D]සැමදා [Bm]මට හිමි[Em]වෙයි..//\n\n[Em]වසංගතය ලං [G]නොමවෙයි\nමගෙ [Am]කූඩාරම සුර[Em]කී..//\n[D]පුතේ කියා මා [C]කැඳවාගත් ඔබ\n[Bm]කිසි නපුරක් නොක[Em]රයි..//",

      "content": "[F]හාලේලුයියා ආ..මෙන්\n[Bb]හාලේලුයියා ආ..මෙන්\n[Dm]හාලේලුයියා ආ..[C]මෙන්\n[Bb]හාලේලුයියා ආමෙන්\n[Dm]හාලේලුයියා ආමෙන්\n[Gm]හාලේලුයියා [C]ආ[F]මෙන්\n\n\n[F]මිදීමේ වීර[Dm]යා [F]නිති ජය මට දෙ[Gm]මින්\n[F]මා තුළ වැජාඹ[Dm]නා [Bb]සංතෝ[C]ෂයි ම[F]ට..//\n\nමා [F]ගයමි ගයමි සතු[Gm]ටින්\nමා [C]නටමි නටමි ස්තූති[F]යෙන්\nමා [Bb]දිව ගොස් කියන්[F]නම්..//\nමගෙ [Gm]ජේසු ජී[C]වම[F]ානයි....\n\nඑතුම් [F]මාව සොයමින් ආ[Gm]වේ\nඒ [C]තුරුලේ සනසලව්[F]වේ...\nමගෙ [Bb]පාප කමා කර[F]ලා...\nනව [Gm]ජීවය[C]ක්ම දුන්[F]නේ....\n\nඒ [F]ප්‍රේමෙ ආලේප[Gm]යෙන්\nපුර[C]වන්න ගෙනයාම[F]ට\nසා[Bb]තන්ගෙ බලය කඩ[F]ලා\nආධි[Gm]පත්‍ය දු[C]න්නා ම[F]ට\n\nරතු [F]මුහුද දෙබෑ කර[Gm]මින්\nජොර්[C]දානෙ පා තබන්[F]නේ\nයෙරි[Bb]කෝව වටා යන්[F]නේ\nහොර[Gm]ණෑවෙ ජ[C]යම ගන්[F]නේ",

      "content": "ඔබ තුරුලට වී ඉන්නට ඇත්නම්\nඑක වරුවක් හෝ දවසකදී\nනිසසල මොහොතක හිමිදිරි උදයක\nඔබ සිරුරේ උණුසුමේ වෙලී\n\nජේසුනී මට ඔබ විශ්වාසයි\nඔබ මගෙ ජීවිතයයි\nසැමදාමත් එහෙමයි...//\n\nගිනිගත් සිතිවිලි නිවෙනා තුරුමා\nඔබ තුරුලේ ඉන්නම්\nපවිටු මගේ සිත සේදී යනතුරු\nඔබ පා නමදින්නම්\nතනි වෙන්නට කිසි දිනෙක ඉඩනොදී\nඔබ පසුපස ඉන්නම්\nදෑතින් ඔබෙ අත අල්ලාගෙන මා\nගීයක් මුමුනන්නම්\n\nඔබ තුරුළට වී......\n\nදුකින් පෙලෙන මිනිසුන් අහුරක් ගෙන\nඔබ පාමුල වැටෙමි\nසැනසීමක් අයදින්නට හිත හිත\nඔබ පාමුල සිටිමි\nවිශ්වාසයි මට විශ්වාසයි\nකිසි දින මා අත් නොහරී\nඔ⁣බ දුන් හුස්මෙන් ජීවත් වන්නට\nමට දිවි ලැබෙනු ඇති...\n\nඔබ තුරුලට වී\n",

      "content": "බිදුණු සිතක් ඇති තනිවුන මොහොතක\nබලාපොරොත්තුද සුන්වේ\nජීවිත දහිරිය මැලවුණ මොහොතක\nමොරගසමී මම ජේසුනේ\n\nදිරිය ගන්නම් දුක කියන්නම්\nඔබ වෙතට ලංවෙන්නම්\nදිරිය ගන්නම් දුක කියන්නම්\nහිමියනේ ලංවෙන්නම්\nසෙනෙහෙ වෙනවද සනසවනවද\nඅනේ මා ප්‍රිය ජේසුනී\n\nජේසුනි ඔබමලු ප්‍රේමය මේලොව\nමා උදෙසා දිවි දුන්නාවූ\nඒ ප්‍රේමය තුළ නිමක් නොමැති බව\nහැඟෙනව මා ප්‍රිය ජේසනී\n\nමවත් ඔබමයි පියත් ඔබමයි\nමිතුරත් ඔබමයි\nජීවිතේ සැප දුකෙහි පතනා නාමෙ ජේසුස්මයි\nජීවිතේ සැප දුකෙහි පතනා නාමෙ ජේසුස්මයි\nනාමෙ ජේසූ ජේසූ මගේ පැතුම ඔබයි..//\nනාමෙ ජේසූ ජේසූ සදා පැතුම ඔබයි..",

      "content": "(පාට් එක හා හාලේලූයියා..)\n\n[A]ම මිදීම දුන් දෙවිඳුන් හට පැසසම් [D]වේවා\nමා [E]වෙනුවෙන් තම පුතු දුන් දෙවිඳුට ස්තූති [A]වේවා\n[D]විනාශයෙන් මා මුදවා\nජී[E]වනයට පැමිනෙව්වා\n[D]පියවූ දෙවිඳුන් [E]හට ස්තූති වේ[A]වා..\n\n[A]හා හාලේ[D]ලුයියා [E]ප්‍රශංසා[A]වේ..\n[F#m]පියවූ දෙවි[D]ඳුන්ට [E]බල මහිමය [A]වේ\nහා හාලේ[D]ලුයියා [E]ප්‍රශංසා[A]වේ...\n[F#m]ත්‍රී එක දෙවි[D]ඳුන්ට [E]බල මහිමය[A]වේ..\n\nමා [A]වෙනුවෙන් දිවි දුන් ජේසුට පැසසුම් [D]වේවා\nකුරු[E]සියෙදී පූජාවූ සමිඳුට ස්තූති [A]වේවා\nමර[D]ණය පාතාලය [Bm]පරදා මල[E]වුන්ගෙන් නැගිටුනා\n[D]ජේසුස් සමිඳුන් [E]හට ස්තුති [A]වේවා..\n\n[A]හා හාලේ[D]ලුයියා [E]ප්‍රශංසා[A]වේ..\n[F#m]ජේසුස් සමි[D]ඳුන්ට [E]බල මහිමය [A]වේ\nහා හාලේ[D]ලුයියා [E]ප්‍රශංසා[A]වේ...\n[F#m]ත්‍රී එක දෙවි[D]ඳුන්ට [E]බල මහිමය[A]වේ..\n\nමට [A]මඟපෙන්වන ශුධතුන් හට පැසසුම් [D]වේවා\nසැන[E]සිලි කරුවානන් හට ස්තූති [A]වේවා\nදෙව් [D]බලයෙන් මා දිවි [Bm]සරසා පෙර[E]ටම මා ගෙනයන්නා\n[D]ශුද්ධාත්මයාණන් [E]හට ස්තූති [A]වේවා..\n\n[A]හා හාලේ[D]ලුයියා [E]ප්‍රශංසා[A]වේ..\n[F#m]ශුද්ධාත්ම දෙවි[D]ඳුන්ට [E]බල මහිමය [A]වේ\n[A]හා හාලේ[D]ලුයියා [E]ප්‍රශංසා[A]වේ...\n[F#m]ත්‍රී එක දෙවි[D]ඳුන්ට [E]බල මහිමය[A]වේ..",

      "content": "ස්වාමින් මාගේ එඬේරාණන් නිසා\nහිඟයක් නොමවේ කිසිදා\nනිල් ගොදුරු බිම් වෙතට මඟ මඟ පෙන්වලා\nනිසල් දිය වෙත මා ගෙනයන්නා\nමගේ ආත්මය ප්‍රාණවත් කරයි\nදමිටුකමේ මඟ මා ගෙනයයි\nඔබෙ නාමේ නිසා..//\nඔබෙ දමිටු වූ නාමේ නිසා\n\nමරණ සෙවනේ මිටියාවත මැද්දේදී වුවත්\nකිසි උවදුරකට බිය නොවෙමි මා\nඑතුමන් දණ්ඩෙන් සැරයටියෙන් මා සනසමින්\nමේ දිවි මඟ මා ගෙනයන්නා\nමරණ සෙවණේ මිටියාවතේ\nකිසි උවදුරකට බිය නොමවන්නේ..\nඔබ මාහා නිසා..// ඔබ සැබවින්ම මාහා නිසා\n\nසතුරා හමුවේ ඔබ මා හට භෝජන සපයලා\nමගෙ හිස තෛලින් ආලේප කලා\nප්‍රීතිය කුසලානය උතුරා ගලනා\nයහපත්කම හා කරුණාගුනේ\nදිවියේ සැමදා මා පසුපස එන්නේ\nසදාකල්හිනා...//\nසදාකල් ඔබගේ ගෘහයේ වසනේ\n\nසදාකල් හිනා....",

      "content": "\n\nඔබ [Dbm]වදනක් කීවත් කරමි\nඔබ [B]පෙන්වන මාර්ගයෙ යන්නෙමි\nඔබ [A]පාමුල නිතරම සිටිමි\nමා [Ab]ප්‍රේම යේසුනි\n\n[Dbm]නමදින්නෙමී ජේසු[Gbm]නී....\n[B]නමදින්නෙමී ජේසු[E]නී....[Ab]....\n\n[Dbm]මුහුදේ මතුපිට ඇවිද්දාවු ඒ [Gbm]පුදුම වූ පාදයන්\n[B]මාගෙ පෙරටුව තිබෙනා විට මා [E]කැලබෙන්නේ නැ\n[Dbm]කැලබුනු මුහුදත් හමනා සුලගත් [Gbm]නැවතු ඒ වදන්\n[B]මාගේ පිහිටට තිබෙනා විට මා [E]කැලබෙන්නේ [Ab]නෑ\n\n[Dbm]මාගේ මාවත අන්ධකාරයෙන් [Gbm]වැසෙනා විට\n[B]මාර්ගය පෙන්වන දෙවිදුන් මාහා [E]කැළඹෙන්නෙ [Ab]නෑ\n[Dbm]මාගේ පසුපස සතුරා ඇවිදින් [Gbm]වට කරනා විට\n[B]ජීවය රකිනා දෙවිදුන් මාහා [E]භය වෙන්නේ [Ab]නෑ",

      "content": "{c: Part}\n{sot}\n👇\n------------------------\n| F - - Gm - - C - - F |\n------------------------\n{eot}\n\n\n[F]ශුද්ධාත්ම[C]යාණ[F]නී[F7]\nශුද්[Bb]ධාත්මයාණ[F]නී\nසුද[C]තුම් වරම් රැගෙ[Gm]නේ\nව[Bb]ඩින්න [C]අප වෙ[F]ත - //\n\nප්‍රඥා[Bb]ව, දැනගැන්[C]ම\nදැන[Bb]මිතිකම, දේව භ[F]ය\n[C]තේරුම් ගැනීම, [Gm]ධෛර්යය\n[Bb]දේව [C]භක්ති[F]ය [F7]\n[Bb]දෙන්න [C]අප වෙ[F]ත\n\nඇතු[Bb]ලාන්ත සිත් සුව[C]ය\nලැබ [Bb]දෙන්න අප හද[F]ට\nපුර[C]වා ඔබේ ශුද්[Gm]ධාත්මයෙන්\n[Gm]සුවයෙ බ[C]ලේ රැගෙ[F]න [F7]\nව[Bb]ඩින්න [C]අපවෙ[F]ත\n\nපා[Bb]පේ වහල් කර[C]න\nදෙවි[Bb]ඳුන් ඈත් කර[F]න\nනපු[C]රේ බලේ සිඳ [Gm]බිඳලන්න\n[C]ශක්තිය ලැබ දෙන්[F]න\nනපු[Bb]රාව [C]ජය ගන්[F]න",

      "content": "[E]ඔබ මෙත[A]නයි අප අතරේ සැරි ස[E]රනා\nනමදි[B]මි නම[C#m]දිමි\nඔබ මෙත[A]නයි අප අතරේ සැරි වස[E]නා\nනමදි[B]මි නමද[C#m]ිමි\n\n\n\n[A]මග සදනා පොරොන්දු රකිනා\n[C#m]හාස්කම් කරනා අදුරෙදි ආලෝක[B]ේ\nඒ ඔබම[C#m] වේ\n\n\nඔබ මෙත[A]නයි අප හදවත් අත ගස[E]නා නමදි[B]මි නම[C#m]දිමි\nඔබ මෙත[A]නයි අප හදවත් සුව ක[E]රනා නමද[B]ිමි න[C#m]මදිමි\n[A]මග සදනා\n\n\n\nඔබ මෙතනය[A]ි අප ජීවිත සාද[E]න්නා නම[B]දිමි [C#m]නමදිමි\nඔබ මෙතනය[A]ි අප හදවත් ගොඩන[E]ගනා න[B]මදිමි [C#m]නමදිමි\n[A]මග සදනා\n\n\n\nඔබ මෙත[A]නයි අප ජීවිත අත ගස[E]නා නමද[B]ිමි න[C#m]මදිමි\nඔබ මෙත[A]නයි අප හිගකම් සපුර[E]න්නා න[B]මදිමි[C#m] නමදිමි\n\n",

      "content": "ඔබෙ ආදරේ ඔබෙ ආදරේ\nඔබෙ ආදරේ සොයි එන්නෙමී\n\nසීමා මායිම් මට වුනු ලෝකේ\nජේසුනි ඔබව සොයා මගෙ ජේසුනි ඔබව සොයා\nබාධා වැට කඩු බිදලා දිව එමි\nජේසුනි ඔබව සොයා ඔබෙ ආදරේ සොයලා\n\nසීමා මායිම් වැටුණු ලෝකේ\nජේසුනි ඔබව සොයා..\n\nඔබෙ ආදරේ ඔබෙ ආදරේ\nඔබෙ ආදරේ සොයි එන්නෙමී\n\nපාපයේ මා වෙලී සිටිද්දී\nමට ආදරේ කරා හදටම ආදරේ කලා\nඒ පාපයේ කුරුසියේ සිරකරලා\nමට ගැළවුම දුන්නා..\nතව තව ඔබ ලංවූවා\n\nපාපයෙ මා වෙලී සිටිද්දී\nඒ පාපය කුරුසියෙ සිර කරලා\n\nඔබෙ ආදරේ ඔබෙ ආදරේ\nඔබෙ ආදරේ සොයි එන්නෙමී\n\nලෝකේ මා වැටි වැටි නැගිටිනවිට\nමා හට අත දුන්නා\nඔබ මා හට අත දුන්නා\nජීවත්වෙන්නට මා හට හයියක්\nජේසුනි ඔබ දුන්නා\nසැමදා මා හට දුන්නා...//\n\nඔබ මා තුළයි සිටියේ සෑමදා\nඔබ මා තුළයි සිටියේ සෑමදා\nඔබ මා තුළයි සිටියේ සෑමදා\n\nඔබෙ ආදරේ ඔබෙ ආදරේ\nඔබෙ ආදරේ සොයි එන්නෙමී\n\n\n\n",

      "content": "{c: Part}\n{sot}\n👇\n------------------------\n  D    G   F#m   G    A\n|  - -  - -  - -  - - |\n  G    F#m  G   Em  A\n------------------------\n{eot}\n\n\n[D]ඔබෙ ප්‍රේමයේ වෙ[Bm]ලී ඉන[G]්නම් [A]සදා\nඔබෙ ම[D]ුහුණේ රශ්මියෙන් [Bm]මා සැනස[G]ෙන්නම් සද[A]ා\nසැපත[Bm]ේ විපත[F#m]ේ අත්හ[G]ැර නොයා ලඟින[A]් ස[-]ිට[F#]ියි\nඅඳු[Bm]රේ එළි[F#m]යේ මග ප[G]ෙන්වලා\n[A]මා රැගෙන යයි\n\nකුණාටුව[G]ේ මා ගැලවීම [F#m]ඔබවේ\nඔබ දෑතේ ස[G]ුරැකිව ඉන්නම් සමි[A]ඳේ\nමරුකතරේ[G] මා දියදහර ඔබ[F#m]වේ\nහුස්මත් ඔ[G]බයි ම[Em]ගේ ජිවි[A]තේ\n\n\nස්පර්ශ ක[G]රන්න මා මේ මොහොතේ [Bm]\nඔබ නමදි[G]න්නටා  මා සමිඳ[Bm]ේ ජ[A]ේසුනේ[D]\n\n\n{c: 2nd Part}\n{sot}\n👇\n------------------------\n ස්පර්ශ කරන්න මා මේ මොහොතේ\n|  - -  - -  - -  - - |\n------------------------\n{eot}\n\n[D]මා යන දිවිමග ඇහිරී  [Bm]ඉදිරිය නොපෙනෙන විටදී\n[G]ජල මධ්‍යයේ  පවා ඔබ ම[Em]ාවතක් සදයි[A]\n[D]ගිනි වැනි පිඩාවෙදී\n[Bm]මරණයෙ  මිටියාවතේදී\n[G]බිය නොවන්නෙමී කිසිදා\n[Em]දෙවිඳුන් මා [A]ලඟයි\n\n\nමග සද[G]නා දෙවිඳු [A]සදා....\nඔබෙ ප[D]්‍රේමයේ ව[Bm]ෙලී",

      "content": "මට ආසයි ඔබ දැකගන්න\nඔබෙ අතැගිලි මත බැදී සිටින්නට\nඔබෙ සළුවෙ කොනේ එල්ලී සිටින්නට\nමට එකම එකවරක් ඔබෙ අවසර දෙන්න\n\nජේසුනි අප අතරේ ඇවිදින්න\nඔබෙ ආදරෙන් මා හද පුරවන්න\nඔබෙ රුධීරයෙන් මා පවිත්‍ර වන්නට\nමට එකම එකවරක් ඔබෙ අවසර දෙන්න\n\nඔබෙ උණුසුමෙන් සිසිලස නිවා දමන්නට\nමගෙ දෙනෙතින් වැටෙනා කදුලැලි පිස දමන්නට\nමගෙ හදවත තුල විදින වේදනාව කියන්නට\nමට එකම එකවරක් ඔබෙ අවසර දෙන්න\n\nජේසුනි අප අතරේ ඇවිදින්න\nඔබෙ ආදරෙන් මා හද පුරවන්න\nඔබෙ රුධීරයෙන් මා පවිත්‍ර වන්නට\nමට එකම එකවරක් ඔබෙ අවසර දෙන්න",

      "content": "[G]මොනවාහරි කර[D]නවාමයි\n[C]මගේ ජේසු අනි[G]වාරයෙන්\n[D]තේරෙන්නෙත් [G]නෑ [D]වැටහෙන්නෙත[Em]් නෑ\n[C]පේන්නෙවත් [G]නෑ\n[D]එනමුත් විශ්වාසයි මගෙ ජේසු\n\n\n[G]රතු මුහුද[Em] ඉදිරියේ\n[D]හමුදාවයි[B] පසුපසේ\n[C]මොනව කරන්නද නෑ [G]වැ⁣ටහෙන්නේ [D]\n[G]ජෙරිකෝවේ ප[Em]ව්ර සේ\n[D]අපෙ ජීවිත [B]බාධකේ\n[C]කෙසේද මා එය බි[G]ඳලා ජයගන්නේ [D]\n\n\n[G]ප්‍රශ්නය ගො[Em]ලියත් වගේ\n[D]මා පුංච[B]ී දවිඳුසේ\n[C]සටන සමිඳුන්ගෙ [G]එය මා අදහන්නේ[D]\n\n\n[G]ගොරවන සිංහ[Em]යො වගේ\n[D]පරික්ෂාව[B] ඇත වටේ\n[C]දානියෙල්ව[G] ඔබමයි මුදවා ගත්[D]තේ.\n\n[G]මොනවා හරි",

      "content": "\n{c: Part}\n{sot}\n👇\n------------------------\nG - C - D - G - C - G - D - G\nC - G - D - G\n------------------------\n{eot}\n\n\n[G]සිතින් අළුත් වෙ[C]ලා [D]සමිඳුන් නමදි[G]මු\nඅපේ [Em]දෑත් සමඟ සිත් [Am]ඔසවලා\n[C]සමිඳුන් පසස[D]මු\n[Cm]සමිඳුන් නමදි[G]මු\n{sot}\n👇\n------------------------\nG - D - Am - G - - C - D -\nC - D - G - - -\n------------------------\n{eot}\n[Em]එක සිතින් මුළු [D]ආත්මයෙන් [C]දෙවිතුමන් දෙස බ[D]ලා\n[Em]යැදුමන් යදිනෙමි [D]රෑ පුරා [C]කඳුලින් නේත් තෙ[D]මා\n[Bm]සමිඳුන් සැනසු [Am]පිරුණු හදින්\n[C]පැසසුම් හඬ න[G]ගා...\n[Cm]පැසසුම් හඬ න[G]ගා.....\n\n[G]සිතින් අළුත්....\n\n{sot}\n👇\n------------------------\nG - D - Am - G - - C - D -\nC - D - G - - -\n------------------------\n{eot}\n\n[Em]සදාකාලයේ [D]රජතුමන් [C]යළි එන දින තු[D]රා\n[Em]සුභසුන ලොව වෙත [D]පතුරවා [C]සාමයේ හඬ න[D]ගා\n[Bm]සමිඳුන් වචනය [Am]දරන හදින්\n[C]මුළු ලොව සනස[D]ලා...//\n[Cm]මුළු ලොව සනස[G]ලා\n\nසිතින් අළුත්....",

      "content": "(Part එක ඔබ අති ශුද්ධයි )\n\n[F#m]ස්වාමීන්ගේ ආත්මය මා කෙරෙ[Bm]හි\nඔබේ [E]නාමය ඔසවන්නෙ[F#m]මි\nස්වාමීන්ගේ ආත්මය මා කෙරෙ[Bm]හි\nඔබේ [E]නාමය නමදින්නෙ[F#m]මි\n\nඔබ අති ශුද්ධයි අ[E]ලංකාරයි [D]තේජසේ [C#]රජතුම[F#m]නි //\n\n[F#m]දිළිඳුන් හට දෙව් වචනය [Bm]දෙන්න\n[E]වහලුන් සැම නිදහස්වී [F#m]යන්න\nබිඳුණු සිත් සනසවා[Bm]ලන්න\nඔබ[E]ගේ ආත්මෙන් මා රැගෙන [F#m]යන්න\n\n[F#m]කරුණාවේ [E]වර්ෂයයි [D]ප්‍රීතියේ [C#]තෛලය [F#m]වේ\nඔබේ [F#m]ආලේපේ [E]මා සමගින් වේ\nමා [D]සමිඳුන් පෙර [C#]මග සදමින්[F#m]නේ\n\n[F#m]ගර්භයෙ මා සැදුව [Bm]සමිඳේ\nමව් [E]කුසටත් පෙර ඔබ  මා හඳු[F#m]නන්නේ\nජාතින් වෙත ඔබ මා ගෙන[Bm]යන්නේ\n[E]මා මුව ඔබ ස්පර්ශ ක[F#m]රන්නේ\n",

      "content": "{c: Part}\n[C]......[G].....[C]......[F]....\n[D].....[G]....[E]....[F]\n[C]......[F]......[Fm].....[C]\n\n\nදේව [C]පියාණන් පුත්‍ර[F]යාණන්ව\n[Am]මහිමයට එසෙව්[G]වා\nඅන් [F]සැමට වඩා සැම [G]දෙයට ව[C]ඩා\nඑතුම් [F]නාමය [Fm]පසසන්[C]න //\n\n[C]සියල්ලටම ඉහ[F]ලින් තබා -\n[G]අඳුර පා යට ද[C]මා - //\n[E]සියල්ල කෙරෙහි [F]බලය ලබා\n[G]පුදුම දේ කරන්[C]නේ - [Dm]රජකම් කරන්[C]නේ\n\nදේව [C]පියාණන් පුත්‍රයාණන්ව...\n\n[C]රජුන්ගේ රජවූ [F]යේසුතුමන් -\n[G]සදා නමදින්නෙ[C]මී - //\n[E]සැම දණ නමමින් [F]එතුම් නාමයට\n[G]ගෞරව කරන්[C]නේ - [Dm]ස්තුති ගී ගයන්[C]නේ\n\nදේව [C]පියාණන්",

      "content": "[Am]සමිඳුන් තුල ප්‍රීති වෙමින් [Dm]මා\n[G]එතුමන් නම වර්ණනා ක[Am]රන්නේ\nසමිදුන් හට ගී ගයමින් [Dm]මා\n[G]එතුමන් නම වර්ණනා ක[Am]රන්නේ\n\n[Am]මිදීමෙ රජිඳුන් ඔ[G]බයි\n[Em]යෙහෝවා දෙවිඳුන් මගේ ශක්ති[Am]යයි..//\n\n[Em]හිඟකම මුලු දේශය [G]වෙලා ගත්ත[Am]ද\n[Em]සියලුම තුරුලියවැල් [G]දළු නොලෑව[Am]ට\n[F]අතුවල සැපසම්පත් [Dm]පිරී නැතිවි[Am]ට\n[G]කිසිදින ප්‍රීතිය නොගි[E]ලේවි මා තු[Am]ල\n\n[Am]මිදීමෙ රජිඳුන් ඔ[G]බයි\n[Em]යෙහෝවා දෙවිඳුන් ම[G]ගේ ශක්ති[Am]යයි...//\n\n[Em]මාගේ මිදීමවූ [G]දෙවිඳුන් තුළ[Am]ම\n[Em]බලයෙන් දිවිගෙවනෙමි [G]සදාකාලෙ[Am]ට\n[F]යමි මා උසස්තැන්හි [Dm]සමිදුන් තුළ[Am]ම\n[G]කිසිදින පැසසුම නොගි[E]ලේවි මා තු[Am]ළ\n\n[Am]සමිදුන් තුළ......",

      "Id": 545,

      "Capo": 0,
      "content": "\n[Cm]කුරුසිය මත ඇන [Bb]පහර ල[Cm]බා\n[Cm]මරණය අභියස [Bb]නිසළ වුනා\n[G#]දහදිය මෙන් ඔබෙ [Bb]රුහිරු ගලා\n[Gm]මුලු ලොව අභියස [G#]මොරදුන්[Cm]නා\n\nපි[Cm]යාන[Fm]ණී මා[Bb]අතැරගි[Eb]යේ ඇයි\n[G#]ඉකිබිඳ ඔබ ඇසු[Bb]වා[Cm]එනමුදු [Fm]පිලිතුරු\n[Bb]නැහැ ලැබු[Eb]නේ[G#]කුරුසියෙ [Gm]දිවි පිදු[Cm]වා\n\n[Cm]පාපයෙ ගිනි [Bb]දැල් මෙන් [G#]නොමිනිස්[Bb]කම්\n[Gm]මේ ලොව දැවු මොහො[Cm]තේ\n[Cm]සාමයේ කුම[Bb]රුන් මිනි[G#]සත් බව[Bb]ගෙන [Gm]අප අතරට වැඩි[G#]යේ..\n[Eb]පාපයේ කු[Bb]ලිය ගෙව[Eb]නා පුදසු[Bb]න\n[Fm]කුරුසිය විය ඔබ[Bb]ගේ\nකස[G#]යෙන් පොඩිකර එල්[Bb]ලා කුරුසෙක [G#]ඔබ මැරු[Gm]නා සමි[Cm]දේ\n\n[Cm]රෝදුක යුද[Bb]බිය පැති[G#]රී දින [Bb]දින [Gm]මනුසත ඇත කැල[Cm]ඹී....\nඔබ [Cm]කීලෙසට[Bb]ම සිදු[G#]වේ සමිදු[Bb]නී [Gm]අවසන ඇත ලන් [Bb]වී...\n[Eb]මරනින් නැගි[Bb]ටුන ජේ[Eb]සුනි ඔබ ය[Bb]ලි [Fm]පැමිනෙන බව දනි[Bb]මී....\nඅව[G#]සර තෙක් මට රැදෙ[Gm]නට ඔබ තුල [G#]නිතිවර [Bb]දුන මැන[Cm]වී....\n\n\n[Cm]කුරුසිය මත ඇන පහර ලබා.",

      "content": "[G]ජේසුනී, ඔබ මා [C]ලගින්,\n[D]ඉන්නවා මට [G]දැනෙනවා\n\n[Em]ඔබගෙන් කොහෙදෝ ඈතට [Am]යන්නේ?\n[D]ඔබගෙන් කොහෙදෝ මා සැඟ[G]වෙන්නේ?\n\nමම [G]ස්වර්ගෙට නැගී ගියත්, ඔබ එහි [C]ඉන්නේ\n[D]පොලවේ කෙලවරදිත්, ඔබ හමු[G]වන්නේ\n[Em]දෙවිඳුනි මා සිත ඔබතුම විම[C]සන්නේ\n[D]ඔබගෙන් සැඟවුනු සිතුවිලි මට [G]නැත්තේ\n\n[G]ඔබගෙන් කොහෙ[Em]දෝ ඈතට [Am]යන්නේ?\n[D]ඔබගෙන් කොහෙදෝ මා සැඟ[G]වෙන්නේ?\n\nමව්[G]කුසෙහි තැනෙන විටත්, ඔබ මා [C]දන්නේ\n[D]රහසින් වැඩෙනා විට මා හඳු[G]නන්නේ\n[Em]ඔබගේ නෙත්, මා ගතවෙත යොමු[C]වෙන්නේ\n[D]බිහිවෙන්නට පෙර සැලසුම ඔබ [G]දන්නේ\n\n[G]ඔබගෙන් කොහෙ[Em]දෝ ඈතට [Am]යන්නේ?\n[D]ඔබගෙන් කොහෙදෝ මා සැඟ[G]වෙන්නේ?\"",

      "content": "[F#m]පටන් ගැන්මේදී දිව්‍ය [E]වාක්‍යානෝ\nවැඩ [D]සිටි සේක දෙවිඳුන් ලෙසි[E]නේ\nසියල්[F#m]ලම ඔබගේ වච[E]නින් නිමවා\nසියල්[D]ලට ඉහළින් රජකම් කර[E]නා......\n\n[Bm]ඔබ තුළ ජීවන[F#m]යයි [A]එය අප ආලෝකය[E]යි...[Eb]//\nනම[D]දින්නෙමි නම[C#m]දින්නෙමි ජේසු[F#m]නි...//\n\n[F#m]වාක්‍යානෝ [E]මාංශවත් වී\nඅප [D]අතරේ වාසය ක[E]ළා\nපියා[F#m]ණන්ගේ ලයේ [E]හිඳිනා වූ\nපුත[D]්‍රයාණන් මහිමය දර[E]නා......\n\n[Bm]ඔබ අදහා ගන්න[F#m]ම් [A]දේව පුතෙකු වන්න[E]ම්...[Eb]//\nනම[D]දින්නෙමි නම[C#m]දින්නෙමි ජේසු[F#m]නි...//\n\nඔබ [D]ශුද්ධයි [E]ශුද්ධයි දෙවිඳු[F#m]නි...//",

      "content": "ඔබ [D]මෙන් වෙන කිසිවෙක් නැ[Bm]තේ\nඔබ [E]මෙන් වෙන කිසිවෙක් නැ[A]තේ....//\n\n​අනර්[A]ඝයි ජේසු[Bm]නි.....\n\nජේසු[E]නි ඔබයි අනර්[A]ඝයි....//\n\n​මගේ [F#m]ප්‍රේමයයි මගේ [E]ප්‍රාණයයි\nමගේ [C#m]ආශාව ඔ[D]බයි ජේසු[F#m]නී.....\nමගේ [D]ප්‍රේමයයි මගේ [E]ප්‍රාණයයි\nමගේ [C#m]ආශාව ඔ[D]බයි ජේසු[F#m]නී.....//\n\n​අලං[F#m]කාරයි.... අලං[D]කාරයි....\nඅලං[A]කාරයි.... මා යේසු[E]නී......//\n\n\nශුද්[A]ධයි..ශුද්[F#m]ධයි...\nසර්ව[D]බලධාරි ඔබම [E]වේ....//\nමහිමය [D]වේ.. මහිමය [B]වේ...\nශුද්[A]ධයි..ශුද්[F#m]ධයි...\nසර්ව[D]බලධාරි ඔබම [E]වේ...\n\nමහිමය [D]වේ....මහිමය [B]වේ....\nආ...[A]මෙන්....",

        const notes = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        let currentSong = null, transposeSteps = 0, isLyricsOnly = false;

        function initApp() {
            if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-theme');
            const savedMode = localStorage.getItem('lyricsMode');
            isLyricsOnly = (savedMode === 'true');
            renderSongs();
            if (savedMode === null) document.getElementById('startModal').classList.add('modal-active');
            
            // Start the Random Title Loop
            startRandomTitleLoop();
        }

        // Random Title Toggle Logic
        function startRandomTitleLoop() {
            const nameElem = document.getElementById('homeTitleName');
            const timeElem = document.getElementById('homeTitleTime');
            
            function scheduleNext() {
                // Random time between 10s and 25s
                const randomDelay = Math.floor(Math.random() * (25000 - 10000 + 1)) + 10000;
                
                setTimeout(() => {
                    const now = new Date();
                    timeElem.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

                    // Animate In
                    nameElem.classList.replace('text-in', 'text-out');
                    timeElem.classList.replace('text-out', 'text-in');

                    // Return to app name after 2 seconds
                    setTimeout(() => {
                        timeElem.classList.replace('text-in', 'text-out');
                        nameElem.classList.replace('text-out', 'text-in');
                        
                        // After finishing one cycle, schedule the next one
                        scheduleNext();
                    }, 2000);

                }, randomDelay);
            }

            scheduleNext();
        }

        function openAbout() { document.getElementById('aboutModal').classList.add('modal-active'); }
        function closeAbout() { document.getElementById('aboutModal').classList.remove('modal-active'); }
        function toggleTheme() { document.body.classList.toggle('light-theme'); localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark'); }
        
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => { console.log(err.message); });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function clearSearchField() {
            const input = document.getElementById('searchInput');
            input.value = '';
            document.getElementById('clearSearch').style.display = 'none';
            renderSongs();
            input.focus();
        }

        function transposeChord(chord, steps) {
            return chord.replace(/[A-G][#b]?/g, (match) => {
                let root = match;
                const flatMap = { "Db": "C#", "Eb": "D#", "Gb": "F#", "Ab": "G#", "Bb": "A#" };
                if (flatMap[root]) root = flatMap[root];
                let index = notes.indexOf(root);
                if (index === -1) return match;
                let newIndex = (index + steps) % 12;
                if (newIndex < 0) newIndex += 12;
                return notes[newIndex];
            });
        }

        function formatLyrics(content, steps) {
            let html = '';
            content.split(/\n\s*\n/).forEach(block => {
                html += `<div class="lyrics-block">`;
                block.split('\n').forEach(line => {
                    if (!line.trim()) return;
                    let lineHtml = `<div class="lyrics-line">`;
                    line.split(/(\[.*?\])/g).forEach(part => {
                        if (part.startsWith('[') && part.endsWith(']')) {
                            lineHtml += `<span class="chord-wrapper"><span class="chord-tag">${transposeChord(part.slice(1, -1), steps)}</span></span>`;
                        } else lineHtml += part;
                    });
                    html += lineHtml + '</div>';
                });
                html += `</div>`;
            });
            return html;
        }

        function updateDisplay() {
            if (!currentSong) return;
            const match = currentSong.content.match(/\[([A-G][#b]?m?[^\]]*)\]/);
            document.getElementById('transposeValue').innerText = (transposeSteps > 0 ? "+" : "") + transposeSteps;
            document.getElementById('rootKeyDisplay').innerText = transposeChord(match ? match[1] : "C", transposeSteps);
            document.getElementById('lyricsContent').innerHTML = formatLyrics(currentSong.content, transposeSteps);
            applyModeStyles();
        }

        function applyModeStyles() {
            const wrapper = document.getElementById('lyricsContentWrapper');
            const toolbar = document.getElementById('chordToolbar');
            const btn = document.getElementById('toggleModeBtn');
            if (isLyricsOnly) {
                wrapper.classList.add('lyrics-only-mode');
                toolbar.classList.add('lyrics-only-mode-toolbar');
                btn.classList.add('text-[var(--primary)]');
            } else {
                wrapper.classList.remove('lyrics-only-mode');
                toolbar.classList.remove('lyrics-only-mode-toolbar');
                btn.classList.remove('text-[var(--primary)]');
            }
        }

        function renderSongs(filter = '') {
            const list = document.getElementById('songsList');
            list.innerHTML = '';
            const sortedSongs = [...songs].sort((a, b) => {
                const numA = (a.SongNumber === undefined || a.SongNumber === null) ? 0 : Number(a.SongNumber);
                const numB = (b.SongNumber === undefined || b.SongNumber === null) ? 0 : Number(b.SongNumber);
                return (numA || Infinity) - (numB || Infinity);
            });

            sortedSongs.filter(s => s.name.toLowerCase().includes(filter.toLowerCase())).forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.onclick = () => {
                    currentSong = song; transposeSteps = 0;
                    document.getElementById('viewSongName').innerText = `${(song.SongNumber && song.SongNumber > 0) ? song.SongNumber + '.' : ''} ${song.name}`;
                    document.getElementById('viewArtistName').innerText = song.author || "Unknown Artist";
                    updateDisplay();
                    document.body.classList.replace('home-active', 'lyrics-active');
                };
                card.innerHTML = `
                    <div class="w-11 h-11 bg-[var(--bg-input)] rounded-xl flex items-center justify-center font-black text-[var(--primary)] text-base shadow-inner">
                        ${(song.SongNumber && song.SongNumber > 0) ? song.SongNumber : '-'}
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold truncate text-[var(--text-main)] text-lg">${song.name}</h3>
                        <p class="text-sm text-[var(--text-muted)] truncate font-medium">${song.author || "Unknown Artist"}</p>
                    </div>
                    <div class="text-[var(--border)]">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" /></svg>
                    </div>`;
                list.appendChild(card);
            });
        }

        function goBack() { document.body.classList.replace('lyrics-active', 'home-active'); }
        function transpose(val) { transposeSteps += val; updateDisplay(); }
        function toggleLyricsOnly() { isLyricsOnly = !isLyricsOnly; localStorage.setItem('lyricsMode', isLyricsOnly); applyModeStyles(); }
        function setInitialMode(mode) { isLyricsOnly = mode; localStorage.setItem('lyricsMode', mode); document.getElementById('startModal').classList.remove('modal-active'); renderSongs(); }

        document.getElementById('searchInput').oninput = (e) => {
            const clearBtn = document.getElementById('clearSearch');
            clearBtn.style.display = e.target.value ? 'flex' : 'none';
            renderSongs(e.target.value);
        };

        initApp();
    </script>
